name: Verify leave workflow
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Database authorization and concurrent approval tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-adesa-leave "npm run test:rules && npm run test:integration --prefix functions"
